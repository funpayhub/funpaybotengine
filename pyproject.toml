[project]
name = "funpaybotengine"
version = "0.9.0"
description = "Framework for creating FunPay bots."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "aiohttp>=3.13.3,<3.14",
    "aiohttp-socks>=0.11.0",
    "eventry>=0.4.6,<0.5.0",
    "funpayparsers>=0.10.0,<0.11.0",
    "pydantic>=2.12,<2.13",
]
authors = [
    {name = "Qvvonk", email="qvvonk@gmail.com"}
]
maintainers = [
    {name = "Qvvonk", email="qvvonk@gmail.com"}
]
keywords = [
    "funpay",
    "bot",
    "api",
    "framework",
    "wrapper",
    "asyncio",
    "http"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Telegram = "https://t.me/funpay_hub"
Issues = "https://github.com/funpayhub/funpaybotengine/issues"
Repository = "https://github.com/funpayhub/funpaybotengine"

[project.optional-dependencies]
docs = [
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.1.3",
    "sphinx-design>=0.6.1",
]
dev = [
    "mypy>=1.10.1",
    "ruff>=0.14.0",
    "pre-commit>=4.5.1",
]
tests = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
redis = [
    "redis[hiredis]>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.10"
strict = true
pretty = true
error_summary = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
exclude = "^(docs|\\.venv)/"

[[tool.mypy.overrides]]
module = [
    "redis.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[pydantic-mypy]
init_forbid_extra = false
init_typed = false
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 99
src = ["funpaybotengine", "tests"]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "docs",
    ".pytest_cache",
]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"
indent-style = "space"

[tool.ruff.lint]
select = [
    "I",
    "N",
    "C4",
    "E",
    "F",
    "T20",
    "RET",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
required-imports = ["from __future__ import annotations"]
force-to-top = ["typing", "dataclasses"]
length-sort = true
lines-between-types = 0
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true
